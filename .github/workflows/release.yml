name: Release Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Prepare release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Use a version tag such as v0.1.0 or v0.2.0-beta.1.'
            exit 1
          fi
          echo "RELEASE_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Verify and build
        run: >-
          ./gradlew --no-daemon
          -PreleaseVersionName="$RELEASE_VERSION_NAME"
          -PreleaseVersionCode="$RELEASE_VERSION_CODE"
          spotlessCheck :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:lintRelease :app:assembleRelease

      - name: Check APK version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          assert metadata['applicationId'] == 'app.bookorbit.community', 'Unexpected application ID'
          elements = metadata['elements']
          assert len(elements) == 1, 'Expected one universal APK'
          assert 'v' + elements[0]['versionName'] == os.environ['RELEASE_TAG'], 'APK version must match the release tag'
          assert elements[0]['versionCode'] == int(os.environ['RELEASE_VERSION_CODE']), 'Unexpected APK version code'
          PY

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. See docs/RELEASING.md."
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/orbit-reader-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p dist
          apk="dist/orbit-reader-${RELEASE_TAG}.apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          cd dist
          sha256sum "orbit-reader-${RELEASE_TAG}.apk" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def api(endpoint, *args):
              output = subprocess.check_output(['gh', 'api', endpoint, *args], text=True)
              return json.loads(output) if output.strip() else None

          repo = os.environ['GH_REPO']
          tag = os.environ['RELEASE_TAG']
          files = [Path('dist') / f'orbit-reader-{tag}.apk', Path('dist/SHA256SUMS')]
          for path in files:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty release asset: {path}')

          pages = api(f'repos/{repo}/releases?per_page=100', '--paginate', '--slurp')
          matches = [release for page in pages for release in page if release['tag_name'] == tag]
          # Prefer the public release when an abandoned draft has the same tag.
          candidates = [release for release in matches if not release['draft']] or matches
          if len(candidates) > 1:
              raise SystemExit(f'Multiple releases match {tag}; resolve duplicates before retrying.')
          if candidates:
              release = candidates[0]
          else:
              release = api(
                  f'repos/{repo}/releases', '--method', 'POST',
                  '-f', f'tag_name={tag}', '-f', f'name=Orbit Reader {tag}',
                  '-F', 'draft=true', '-F', 'generate_release_notes=true',
                  '-F', f'prerelease={str("-" in tag).lower()}',
              )

          release_id = release['id']
          expected = {}
          for path in files:
              with path.open('rb') as source:
                  digest = 'sha256:' + hashlib.file_digest(source, 'sha256').hexdigest()
              expected[path.name] = (path.stat().st_size, digest)
              asset = next((item for item in release['assets'] if item['name'] == path.name), None)
              if asset:
                  if (asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
                          and asset.get('digest') == digest):
                      continue
                  if not release['draft']:
                      raise SystemExit(f'Refusing to replace published asset: {path.name}')
                  api(f'repos/{repo}/releases/assets/{asset["id"]}', '--method', 'DELETE')
              api(
                  f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={path.name}',
                  '--method', 'POST', '-H', 'Content-Type: application/octet-stream',
                  '--input', str(path),
              )

          def verify_assets(current):
              assets = {asset['name']: asset for asset in current['assets']}
              for name, (size, digest) in expected.items():
                  asset = assets.get(name, {})
                  if (asset.get('state') != 'uploaded' or asset.get('size') != size
                          or asset.get('digest') != digest):
                      raise SystemExit(f'Release asset verification failed: {name}')

          endpoint = f'repos/{repo}/releases/{release_id}'
          verify_assets(api(endpoint))
          if release['draft']:
              api(endpoint, '--method', 'PATCH', '-F', 'draft=false')
          published = api(endpoint)
          verify_assets(published)
          if published['draft']:
              raise SystemExit('Release is still a draft.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'APK and checksum published: {published["html_url"]}\n')
          PYTHON

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/orbit-reader-release.jks"
